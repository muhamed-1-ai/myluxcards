<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">MYLUXCARDS luxury logo</title>
  <desc id="logoDesc">Elegant gold monogram with crown and card motif on dark textured background.</desc>
  <defs>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E6A0"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A57D20"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4C7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E3C462" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C49733"/>
      <stop offset="100%" stop-color="#8A6A18"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="780" height="340" fill="transparent"/>

  <g filter="url(#shadow)">
    <rect x="110" y="60" width="560" height="220" rx="38" fill="#070607" stroke="rgba(212,175,55,0.24)" stroke-width="3"/>
  </g>

  <path d="M256 110c-42 0-74 32-74 72v82h24v-78c0-28 20-48 50-48 28 0 46 20 46 48v78h24v-78c0-22-14-42-38-48l20-38h-16l-18 36-18-36h-14l20 38Z" fill="url(#goldMain)"/>
  <path d="M314 182h-24v-18h-6v18h-24v16h24v58h26v-58h24v-16Zm28-18h-18v80h18v-80Z" fill="url(#goldLight)"/>
  <path d="M364 128h60a16 16 0 0 1 16 16v104a16 16 0 0 1-16 16h-60a16 16 0 0 1-16-16V144a16 16 0 0 1 16-16Zm0 16v104h60V144h-60Z" fill="none" stroke="url(#goldShadow)" stroke-width="5"/>

  <path d="M360 70c0-14 12-26 26-26s26 12 26 26c0 8-3 15-8 20l-18 14-18-14c-5-5-8-12-8-20Z" fill="url(#goldMain)"/>
  <path d="M344 86h88l-24-36h-40l-24 36Z" fill="url(#goldLight)"/>
  <path d="M348 76h80l-16-24h-48l-16 24Z" fill="url(#goldShadow)" opacity="0.45"/>

  <path d="M274 234h224" stroke="rgba(212,175,55,0.18)" stroke-width="4" stroke-linecap="round"/>
  <text x="390" y="282" text-anchor="middle" font-family="Cinzel, serif" font-size="44" font-weight="800" letter-spacing="0.12em" fill="url(#goldMain)">MYLUXCARDS</text>
  <text x="390" y="310" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="600" letter-spacing="0.18em" fill="#D4AF37">PREMIUM. QUALITY.</text>
</svg>

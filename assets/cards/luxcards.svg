<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="zappitBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0057FF"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#E056FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#0066FF" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="560" rx="40" fill="url(#bg)"/>
  <g filter="url(#softShadow)">
    <rect x="90" y="110" width="620" height="340" rx="28" fill="url(#cardGradient)" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="130" y="142" width="140" height="14" rx="7" fill="#1E293B" opacity="0.9"/>
    
    {/* Chip Graphic */}
    <rect x="130" y="180" width="64" height="48" rx="8" fill="none" stroke="url(#zappitBlue)" stroke-width="2"/>
    <rect x="142" y="190" width="40" height="28" rx="4" fill="none" stroke="url(#zappitBlue)" stroke-width="1.5"/>

    {/* Zappit Brand Title */}
    <text x="132" y="300" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="800">Zapp<tspan fill="#FFFFFF">ı</tspan>t</text>
    <circle cx="230" cy="268" r="5" fill="url(#magentaGrad)"/>
    <text x="132" y="340" fill="#00D9FF" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="3">SMART TAP SOLUTIONS</text>
    <text x="132" y="390" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="16" font-weight="500">Connected NFC Ecosystem</text>

    {/* Right NFC Signal Wave Icon */}
    <circle cx="610" cy="200" r="42" fill="rgba(0,102,255,0.15)"/>
    <circle cx="610" cy="200" r="28" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <path d="M598 200C598 193.373 603.373 188 610 188" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="610" cy="200" r="4" fill="#B026FF"/>
  </g>
</svg>

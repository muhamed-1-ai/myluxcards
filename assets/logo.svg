<svg width="220" height="50" viewBox="0 0 220 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zappitGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00D9FF" />
      <stop offset="50%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#0057FF" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E056FF" />
      <stop offset="100%" stopColor="#B026FF" />
    </linearGradient>
    <filter id="zGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <rect x="2" y="5" width="40" height="40" rx="11" fill="#080B12" stroke="url(#zappitGrad)" stroke-width="2.2"/>
  <path d="M13 18C17.5 13.5 24.5 13.5 29 18" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M16 22C18.8 19.2 23.2 19.2 26 22" stroke="#0066FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 21L16 30H22L20 35L28 26H22L24 21Z" fill="url(#zappitGrad)" filter="url(#zGlow)"/>
  <circle cx="29" cy="14" r="2.8" fill="url(#magentaGrad)" filter="url(#zGlow)"/>

  <!-- Logo Wordmark -->
  <text x="52" y="32" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">Zapp<tspan fill="#FFFFFF">ı</tspan>t</text>
  <!-- Purple/Magenta dot over the 'i' -->
  <circle cx="127.2" cy="14.5" r="2.8" fill="url(#magentaGrad)" filter="url(#zGlow)"/>

  <!-- Subtitle Tagline -->
  <text x="53" y="43" font-family="'Inter', sans-serif" font-weight="700" font-size="7.5" fill="#00D9FF" letter-spacing="2.2" text-transform="uppercase">SMART TAP SOLUTIONS</text>
</svg>
